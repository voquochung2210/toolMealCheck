name: Build and Release

on:
  push:
    tags:
      - 'v*' # Trigger workflow when pushing a tag starting with 'v', e.g. v1.0.0

jobs:
  release:
    runs-on: windows-latest

    permissions:
      contents: write # Need this permission to create a GitHub Release

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22 # You can change this to match your local Node.js version
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build React App
        run: npm run build:react

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Xóa các draft release cùng tên nếu có để tránh lỗi
          gh release delete ${{ github.ref_name }} -y || true
          # Tạo một Release mới
          gh release create ${{ github.ref_name }} --title ${{ github.ref_name }} --notes "Bản cập nhật ${{ github.ref_name }}"

      - name: Build and Publish Electron App
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Automatically provided by GitHub Actions
        run: npx electron-builder --publish always
